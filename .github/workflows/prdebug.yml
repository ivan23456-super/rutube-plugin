name: PR debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-36"
      - name: Build and index with a throwaway key
        run: |
          set +e
          ./gradlew :tools:genKey -PpluginSigningKey="$RUNNER_TEMP/ci.key" > /tmp/g1.log 2>&1
          g1=$?
          echo "::error::genkey exit=$g1"
          tail -25 /tmp/g1.log | while IFS= read -r line; do echo "::error::g1 $line"; done
          ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/ci.key" > /tmp/g2.log 2>&1
          code=$?
          echo "index exit=$code"
          grep -nE "FAILURE|error:|Caused by|What went wrong|> Task .*FAILED|Could not" /tmp/g2.log | head -20 | while IFS= read -r line; do echo "::error::g2 $line"; done
          grep -c "BUILD SUCCESSFUL" /tmp/g2.log | while read -r c; do echo "::error::g2 success-lines=$c"; done
          exit 0
