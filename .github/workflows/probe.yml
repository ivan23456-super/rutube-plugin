name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe TV channels
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe15 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          for u in "https://rutube.ru/tv/" "https://rutube.ru/tv/channels/" "https://rutube.ru/tv/" ; do
            printf '\n## HTML %s\n' "$u" >> "$OUT"
            code=$(get "$u" -o /tmp/tv.html -w '%{http_code}')
            printf 'http=%s bytes=%s\n' "$code" "$(wc -c </tmp/tv.html)" >> "$OUT"
            grep -oE 'https://rutube\.ru/api/[a-zA-Z0-9/_.-]*' /tmp/tv.html | sort -u | head -20 >> "$OUT"
            grep -oE '"[^"]*tv[^"]*api[^"]*"|api[^"]*tv[^"]*' /tmp/tv.html | sort -u | head -20 >> "$OUT"
            grep -oE 'href="/tv/[^"]*"' /tmp/tv.html | sort -u | head -20 >> "$OUT"
          done
          for u in "https://rutube.ru/api/video/tv/?format=json" "https://rutube.ru/api/tv/channels/?format=json" "https://rutube.ru/api/tv/?format=json" "https://rutube.ru/api/metainfo/tv/?format=json" "https://rutube.ru/api/tv/channel/?format=json" "https://rutube.ru/api/video/tv/channels/?format=json" "https://rutube.ru/api/live/tv/?format=json" "https://rutube.ru/api/v1/tv/channels/?format=json" "https://rutube.ru/api/metainfo/tv/channels/?format=json" "https://rutube.ru/api/tv/channels/list/?format=json"; do
            printf '\n## %s\n' "$u" >> "$OUT"
            code=$(get "$u" -o /tmp/r.json -w '%{http_code}')
            printf 'http=%s bytes=%s\n' "$code" "$(wc -c </tmp/r.json)" >> "$OUT"
            jq -c 'if type=="object" then {keys:(keys), n:(.results|length?), first:(.results[0]? // .channels[0]? // empty | if type=="object" then {id,title,name,is_livestream,video_url,slug,url} else . end)} else {type:type, n:length} end' /tmp/r.json 2>/dev/null | head -c 900 >> "$OUT"
          done
      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist endpoints" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
