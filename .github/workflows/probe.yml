name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe API round 4
        run: |
          set -u
          set +e
          exec 2>>probe-trace.log
          set -x
          OUT=probe-results.md
          echo "# probe4 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          q='%D0%BA%D0%BE%D1%82'
          P='https://rutube.ru/pangolin/api/web/v1/search/combined/video_playlist'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }

          echo -e '\n## ordering variants' >> "$OUT"
          for v in 'order_by=publication_ts_down' 'order_by=publication_ts_up' 'sort_by=created' 'sort=-created' 'ordering=created' 'order_by=created_ts_down&client=wdp'; do
            printf '\n- %s\n' "$v" >> "$OUT"
            get "$P?query=$q&page=1&$v" | jq -c '[.results[]|select(.content_type=="video")|.created_ts][:3]' >> "$OUT"
          done

          echo -e '\n## JS bundles mentioning order_by' >> "$OUT"
          get "https://rutube.ru/search/?query=$q" -o /tmp/s.html
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/s.html | head -12 >> "$OUT"
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/s.html | sed -E 's/src="([^"]+)"/\1/' | head -8); do
            case "$js" in http*) url="$js";; /*) url="https://rutube.ru$js";; *) url="https://rutube.ru/$js";; esac
            get "$url" -o /tmp/b.js
            printf '\n- %s (%s bytes)\n' "$js" "$(wc -c </tmp/b.js)" >> "$OUT"
            grep -oE '(order_by|sort_by|created|duration)=[a-z_]{2,20}' /tmp/b.js | sort -u | head -12 >> "$OUT"
          done

          echo -e '\n## cards playlist first item' >> "$OUT"
          get "https://rutube.ru/api/search/combined/cards/list?query=$q&page=1&content_type=playlist" | jq -c '.results[0]' >> "$OUT"

          echo -e '\n## shorts next over https' >> "$OUT"
          get "https://search-backend.rutube.ru/api/search/shorts?query=$q&page=2&per_page=20" | jq -c '{count,n:(.results|length),next}' >> "$OUT"

          echo -e '\n## channel cards next over https' >> "$OUT"
          get "https://rutube.ru/api/search/combined/cards/list?query=$q&page=1&content_type=channel" | jq -c '{count,next,first:(.results[0]|{name,view_url,id,type})}' >> "$OUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md probe-trace.log
          git commit -m "probe: round 4"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
