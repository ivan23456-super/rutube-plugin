name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe API
        run: |
          set -u
          OUT=probe-results.md
          echo "# probe $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          q='%D0%BA%D0%BE%D1%82'
          P='https://rutube.ru/pangolin/api/web/v1/search/combined/video_playlist'
          summarize() {
            local label="$1"; shift
            {
              printf '\n## %s\n' "$label"
              code=$(curl -sS -L --max-time 25 -A "$UA" -o /tmp/body.json -w '%{http_code}' "$@")
              printf 'http=%s n=' "$code"
              jq -r '(.results|length?)|tostring' /tmp/body.json 2>/dev/null || echo '?'
              jq -c '[.results[]? | {t:(.content_type//""), ti:((.title//"")|.[0:24])}][:3]' /tmp/body.json 2>/dev/null || true
            } >> "$OUT"
          }
          summarize 'pang base'                 "$P?query=$q&page=1"
          summarize 'pang created=all-time'     "$P?query=$q&page=1&created=all-time"
          summarize 'pang created=day'          "$P?query=$q&page=1&created=day"
          summarize 'pang duration=any'         "$P?query=$q&page=1&duration=any"
          summarize 'pang duration=movie'       "$P?query=$q&page=1&duration=movie"
          summarize 'pang created=year'         "$P?query=$q&page=1&created=year"
          summarize 'pang default-mix (all-time+any)' "$P?query=$q&page=1&created=all-time&duration=any"
          summarize 'pang sort=created'         "$P?query=$q&page=1&sort=created"
          summarize 'pang sort=hits'            "$P?query=$q&page=1&sort=hits"
          summarize 'old /api/search/video/ base'      "https://rutube.ru/api/search/video/?query=$q&limit=5"
          summarize 'old / created=week'        "https://rutube.ru/api/search/video/?query=$q&limit=5&created=week"
          summarize 'old / duration=short'      "https://rutube.ru/api/search/video/?query=$q&limit=5&duration=short"
          summarize 'old / sort=hits'           "https://rutube.ru/api/search/video/?query=$q&limit=5&sort=hits"
          summarize 'old / sort=created'        "https://rutube.ru/api/search/video/?query=$q&limit=5&sort=created"
          summarize 'old playlist /'            "https://rutube.ru/api/search/playlist/?query=$q&limit=5"
          summarize 'old channel /'             "https://rutube.ru/api/search/channel/?query=$q&limit=5"
          summarize 'cards playlist'            "https://rutube.ru/api/search/combined/cards/list?query=$q&page=1&content_type=playlist"
          summarize 'shorts default-mix'        "https://rutube.ru/api/search/shorts?query=$q&page=1&created=all-time&duration=any"
          summarize 'shorts created=day'        "https://rutube.ru/api/search/shorts?query=$q&page=1&created=day"

          opts() {
            local label="$1"; local id="$2"; local qs="$3"; shift 3
            {
              printf '\n## options %s id=%s qs=%s\n' "$label" "$id" "$qs"
              code=$(curl -sS -L --max-time 25 -A "$UA" -o /tmp/o.json -w '%{http_code}' "$@" "https://rutube.ru/api/play/options/$id/?$qs")
              printf 'http=%s bytes=%s\n' "$code" "$(wc -c </tmp/o.json)"
              jq -c '{keys:keys, detail:(.detail.type?//null), balancer:(.video_balancer|tostring|.[0:100]), live:(.live_streams|tostring|.[0:220])}' /tmp/o.json 2>/dev/null || head -c 200 /tmp/o.json
            } >> "$OUT"
          }
          LIVE=546602986e6a424d74d594876ddb3f04
          opts 'tnt plain'        "$LIVE" 'format=json'
          opts 'tnt rutubedl qs'  "$LIVE" 'no_404=true&referer=https%3A%2F%2Frutube.ru&pver=v2&format=json'
          opts 'tnt dbl-enc qs'   "$LIVE" 'no_404=true&referer=https%253A%252F%252Frutube.ru&pver=v2&format=json'
          opts 'tnt qs+hdr'       "$LIVE" 'no_404=true&referer=https%3A%2F%2Frutube.ru&pver=v2&format=json' -H 'Referer: https://rutube.ru/'
          opts 'tnt qs+xff'       "$LIVE" 'no_404=true&referer=https%3A%2F%2Frutube.ru&pver=v2&format=json' -H 'X-Forwarded-For: 127.0.0.1'

          echo >> "$OUT"
          echo '## live ids from pangolin created=day' >> "$OUT"
          curl -sS -L --max-time 25 -A "$UA" "$P?query=$q&page=1&created=day" | jq -r '[.results[]|select(.is_livestream==true)|.id][:3]|join(" ")' >> "$OUT"
          ids=$(curl -sS -L --max-time 25 -A "$UA" "$P?query=$q&page=1&created=day" | jq -r '[.results[]|select(.is_livestream==true)|.id][:3]|join(" ")')
          for id in $ids; do
            opts 'live-feed plain' "$id" 'format=json'
            opts 'live-feed qs'    "$id" 'no_404=true&referer=https%3A%2F%2Frutube.ru&pver=v2&format=json'
          done

          VOD=$(curl -sS -L --max-time 25 -A "$UA" "$P?query=$q&page=1" | jq -r '[.results[]|select(.content_type=="video")|.id][0]')
          opts 'vod plain' "$VOD" 'format=json'
          opts 'vod qs'    "$VOD" 'no_404=true&referer=https%3A%2F%2Frutube.ru&pver=v2&format=json'

      - name: Commit results
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: round 2"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
