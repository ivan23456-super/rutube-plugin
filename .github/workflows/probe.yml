name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe playlist endpoints
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe13 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          CH=5223991
          show() {
            local label="$1" url="$2"
            printf '\n## %s\n%s\n' "$label" "$url" >> "$OUT"
            code=$(get "$url" -o /tmp/r.json -w '%{http_code}')
            printf 'http=%s bytes=%s\n' "$code" "$(wc -c </tmp/r.json)" >> "$OUT"
            jq -c '{count,next,n:(.results|length?),firstKeys:(.results[0]?|keys?)}' /tmp/r.json 2>/dev/null >> "$OUT"
          }
          show 'playlist/user' "https://rutube.ru/api/playlist/user/$CH/?format=json&page=1&limit=20"
          show 'playlist/user no format' "https://rutube.ru/api/playlist/user/$CH/?page=1&limit=20"
          show 'pinned_playlists' "https://rutube.ru/api/v1/channels/$CH/pinned_playlists?page=1&limit=10&order_by=created_ts_desc&limit_video=20"
          show 'favorite playlists' "https://rutube.ru/api/metainfo/playlist/favorite?author_id=$CH&format=json"

          echo -e '\n## playlist/user first item (full)' >> "$OUT"
          get "https://rutube.ru/api/playlist/user/$CH/?format=json&page=1&limit=20" -o /tmp/u.json
          jq -c '.results[0]' /tmp/u.json >> "$OUT" 2>/dev/null
          echo -e '\n## pinned first item' >> "$OUT"
          get "https://rutube.ru/api/v1/channels/$CH/pinned_playlists?page=1&limit=10&order_by=created_ts_desc&limit_video=20" -o /tmp/pin.json
          jq -c '.results[0]' /tmp/pin.json >> "$OUT" 2>/dev/null

          PID=$(jq -r '.results[0].id // empty' /tmp/u.json)
          echo -e "\n## playlist id -> $PID" >> "$OUT"
          if [ -n "$PID" ]; then
            show 'playlist info' "https://rutube.ru/api/playlist/custom/$PID/?format=json"
            show 'playlist videos' "https://rutube.ru/api/playlist/custom/$PID/videos/?page=1&limit=20&format=json"
            echo -e '\n## playlist videos first item keys' >> "$OUT"
            get "https://rutube.ru/api/playlist/custom/$PID/videos/?page=1&limit=20&format=json" -o /tmp/pv.json
            jq -c '{count,n:(.results|length?),keys:(.results[0]|keys)}' /tmp/pv.json >> "$OUT"
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist endpoints" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
