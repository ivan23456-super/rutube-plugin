name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe channel playlist endpoint
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe10 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          get "https://rutube.ru/channel/5223991/playlists/" -o /tmp/pl.html

          echo -e '\n## api/playlist paths in html' >> "$OUT"
          grep -oE 'api(\\?/|/)playlist[a-zA-Z0-9/_?=&.;:-]*' /tmp/pl.html | sort -u | head -20 >> "$OUT"

          echo -e '\n## react-query keys' >> "$OUT"
          grep -oE '[a-zA-Z]{3,40}\(\\+"?\[\\+"?' /tmp/pl.html | sort -u | head -40 >> "$OUT"
          grep -oE '\\"[a-zA-Z]{4,40}\(\\\[' /tmp/pl.html | sed -E 's/\\"//g' | sort -u | head -40 >> "$OUT"

          echo -e '\n## snippets around getPlaylist' >> "$OUT"
          grep -oE '.{40}[gG]etPlaylist.{160}' /tmp/pl.html | head -6 >> "$OUT"
          echo -e '\n## snippets around playlistCount' >> "$OUT"
          grep -oE '.{20}playlists?Count.{160}' /tmp/pl.html | head -4 >> "$OUT"

          echo -e '\n## playlist objects in state' >> "$OUT"
          grep -oE '\{[^{}]{0,300}video_count[^{}]{0,300}\}' /tmp/pl.html | head -2 >> "$OUT"

          echo -e '\n## queries block dump' >> "$OUT"
          python3 - <<'PY' >> "$OUT"
import re
html = open('/tmp/pl.html', encoding='utf-8', errors='replace').read()
i = html.find('"queries"')
print(html[i:i+1500].replace('\\"', '"') if i >= 0 else 'queries not found')
PY

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist endpoint" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
