name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe channel playlists
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe9 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          CH2=5223991
          CH=657766

          echo -e '\n## playlists page' >> "$OUT"
          get "https://rutube.ru/channel/$CH2/playlists/" -o /tmp/pl.html -w 'http=%{http_code} bytes=%{size_download}\n' >> "$OUT"
          grep -oE '/api/[a-z0-9/_.-]+' /tmp/pl.html | sort -u | head -30 >> "$OUT"
          echo '-- snippets with playlist:' >> "$OUT"
          grep -oE '.{80}playlist.{120}' /tmp/pl.html | head -8 >> "$OUT"

          echo -e '\n## redux query keys (playlists page)' >> "$OUT"
          grep -oE '"(queries|api)"|"[a-zA-Z]+By[A-Za-z]+"' /tmp/pl.html | sort -u | head -40 >> "$OUT"

          echo -e '\n## live tab / rst matrix for MATCH' >> "$OUT"
          for u in "https://rutube.ru/channel/$CH/live/" "https://rutube.ru/channel/$CH/videos/" "https://rutube.ru/api/video/person/$CH/?page=1&format=json&origin__type=rst" "https://rutube.ru/api/video/person/$CH/?page=1&format=json" ; do
            printf '\n- %s\n' "$u" >> "$OUT"
            code=$(get "$u" -o /tmp/x.bin -w '%{http_code}')
            printf 'http=%s bytes=%s\n' "$code" "$(wc -c </tmp/x.bin)" >> "$OUT"
            jq -c '{n:(.results|length?),types:([.results[]?|(.origin_type//"?")]|group_by(.)|map({(.[0]):length})),live:([.results[]?|select(.is_livestream==true)]|length)}' /tmp/x.bin 2>/dev/null >> "$OUT" || true
          done

          echo -e '\n## playlist POST attempt' >> "$OUT"
          get -X POST -H 'Content-Type: application/json' -d '{}' "https://rutube.ru/api/playlist/custom/?author=$CH2&format=json&page=1" -o /tmp/pp.json -w 'http=%{http_code} bytes=%{size_download}\n' >> "$OUT"
          head -c 300 /tmp/pp.json >> "$OUT"

          echo -e '\n## other playlist paths' >> "$OUT"
          for u in \
            "https://rutube.ru/api/playlist/custom/?format=json&author=$CH2" \
            "https://rutube.ru/api/playlist/custom/?format=json&author_id=$CH2" \
            "https://rutube.ru/api/playlist/custom/?format=json&user=$CH2" \
            "https://rutube.ru/api/playlist/custom/?format=json&profile=$CH2" \
            "https://rutube.ru/api/playlist/custom/?format=json&owner=$CH2" ; do
            printf '\n- %s: ' "$u" >> "$OUT"
            get "$u" -o /tmp/y.json -w 'http=%{http_code} ' >> "$OUT"
            jq -c '{count,n:(.results|length?)}' /tmp/y.json 2>/dev/null >> "$OUT" || echo '' >> "$OUT"
          done

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: channel playlists" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
