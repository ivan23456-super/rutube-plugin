name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe channel playlist endpoint
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe10 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          get "https://rutube.ru/channel/5223991/playlists/" -o /tmp/pl.html

          echo '## api/playlist paths in html' >> "$OUT"
          grep -oE 'api[^"\\]{0,80}playlist[^"\\]{0,60}' /tmp/pl.html | sort -u | head -20 >> "$OUT"

          echo '## queries block' >> "$OUT"
          grep -oE '\\"queries\\":\{.{0,2500}' /tmp/pl.html | head -c 2500 >> "$OUT"
          echo >> "$OUT"

          echo '## query names' >> "$OUT"
          grep -oE '[a-zA-Z]{4,40}\(\\\[' /tmp/pl.html | sort -u | head -40 >> "$OUT"

          echo '## snippets around getPlaylist' >> "$OUT"
          grep -oiE '.{40}getplaylist.{200}' /tmp/pl.html | head -4 >> "$OUT"

          echo '## playlist object sample' >> "$OUT"
          grep -oE '\{[^{}]{0,240}video_count[^{}]{0,240}\}' /tmp/pl.html | head -2 >> "$OUT"

          echo '## channel page: playlists link + counts' >> "$OUT"
          grep -oE 'channel/5223991/playlists/[^"]{0,40}' /tmp/pl.html | head -3 >> "$OUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist endpoint" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
