name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe login cookies
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe14 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          for u in "https://rutube.ru/" "https://rutube.ru/video/5f2b73ea71eb50d45e280e3fa5a31572/" "https://rutube.ru/api/video/5f2b73ea71eb50d45e280e3fa5a31572/?format=json"; do
            printf '\n## %s\n' "$u" >> "$OUT"
            curl -sS -D /tmp/h -o /dev/null -A "$UA" --max-time 25 "$u"
            grep -i '^set-cookie' /tmp/h | sed -E 's/^[Ss]et-[Cc]ookie: *([^=]+)=.*/\1/' | sort -u >> "$OUT"
          done
          echo -e '\n## auth-ish endpoints (anon)' >> "$OUT"
          for u in "https://rutube.ru/api/auth/whoami/?format=json" "https://rutube.ru/api/profile/current/?format=json" "https://rutube.ru/api/v3/auth/check/?format=json"; do
            printf '%s -> %s\n' "$u" "$(curl -sS -o /tmp/b -w '%{http_code}' -A "$UA" --max-time 20 "$u") $(head -c 120 /tmp/b)" >> "$OUT"
          done

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist endpoints" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
