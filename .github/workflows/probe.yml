name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe API round 6
        run: |
          set -u
          set +e
          exec 2>>probe-trace.log
          set -x
          OUT=probe-results.md
          echo "# probe6 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          P='https://rutube.ru/pangolin/api/web/v1/search/combined/video_playlist'
          q='%D0%BA%D0%BE%D1%82'

          echo -e '\n## filter enums' >> "$OUT"
          for v in 'created=day' 'created=week' 'created=month' 'created=year' 'duration=short' 'duration=medium' 'duration=long' 'duration=movie' 'created=month&duration=medium'; do
            printf '\n- %s: ' "$v" >> "$OUT"
            get "$P?query=$q&page=1&$v" -o /tmp/f.json -w '%{http_code} ' >> "$OUT"
            jq -c '.results|length' /tmp/f.json >> "$OUT" 2>/dev/null || echo 0 >> "$OUT"
          done

          echo -e '\n## VOD options structure' >> "$OUT"
          VOD=4ceb9757e7eec396856b7c7b08b7565a
          get "https://rutube.ru/api/play/options/$VOD/?format=json" -o /tmp/vod.json
          jq -c '{keys:keys, balancer:.video_balancer, live_streams:(.live_streams|tostring|.[0:200]), captions:(.captions|length)}' /tmp/vod.json >> "$OUT"
          m3u8=$(jq -r '.video_balancer.m3u8 // .video_balancer.default // empty' /tmp/vod.json)
          printf 'm3u8=%s\n' "$m3u8" >> "$OUT"
          if [ -n "$m3u8" ]; then
            echo '- plain fetch:' >> "$OUT"
            get "$m3u8" -o /tmp/m.m3u8 -w 'http=%{http_code} bytes=%{size_download}\n' >> "$OUT"
            head -6 /tmp/m.m3u8 >> "$OUT"
            echo '- referer fetch:' >> "$OUT"
            get "$m3u8" -H 'Referer: https://rutube.ru/' -o /tmp/m2.m3u8 -w 'http=%{http_code} bytes=%{size_download}\n' >> "$OUT"
            grep -c 'EXT-X-STREAM-INF' /tmp/m2.m3u8 >> "$OUT" 2>/dev/null
            grep -o 'RESOLUTION=[0-9x]*' /tmp/m2.m3u8 | head -4 >> "$OUT"
          fi

          echo -e '\n## kiosk page 2' >> "$OUT"
          get "https://rutube.ru/api/v2/video/recommendation/main?limit=20&offset=20" | jq -c '{n:(.results|length),next}' >> "$OUT"

          echo -e '\n## channel page url check' >> "$OUT"
          for u in "https://rutube.ru/channel/5223991/" "https://rutube.ru/video/person/5223991/"; do
            printf '\n- %s ' "$u" >> "$OUT"
            get "$u" -o /dev/null -w 'http=%{http_code} final=%{url_effective}\n' >> "$OUT"
          done

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md probe-trace.log
          git commit -m "probe: round 6"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
