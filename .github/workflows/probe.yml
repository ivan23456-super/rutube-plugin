name: Probe

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect playlist bundle
        run: |
          set -u
          set +e
          OUT=probe-results.md
          echo "# probe12 $(date -u)" > "$OUT"
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          get() { curl -sS -L --max-time 25 -A "$UA" "$@"; }
          URL='https://static.rtbcdn.ru/woodpecker/assets/release-woodpecker-360-0-0-8d883016/web/9221.js'
          get "$URL" -o /tmp/b.js -w 'http=%{http_code} bytes=%{size_download}\n' >> "$OUT"

          echo '## around playlist/custom' >> "$OUT"
          grep -oE '.{160}playlist/custom.{200}' /tmp/b.js | head -6 >> "$OUT"

          echo '## around author' >> "$OUT"
          grep -oE '.{80}(author|author_id|profile_id|user_id|owner).{120}' /tmp/b.js | head -10 >> "$OUT"

          echo '## channelTab playlist functions' >> "$OUT"
          grep -oE '.{0,120}(channelTabMainPlaylist|fetchChannelPinnedPlaylists).{0,220}' /tmp/b.js | head -4 >> "$OUT"

          echo '## api paths with query templates' >> "$OUT"
          grep -hoE '/api/playlist[a-zA-Z0-9/_.-]*[^`"'"'"']{0,80}' /tmp/b.js | sort -u | head -20 >> "$OUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add probe-results.md
          git commit -m "probe: playlist bundle" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
