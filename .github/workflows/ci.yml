name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-36"
      # Only checks that the plugin builds, dexes and produces a valid index; the key is thrown away.
      - name: Build and index with a throwaway key
        run: |
          set -o pipefail
          ./gradlew :tools:genKey -PpluginSigningKey="$RUNNER_TEMP/ci.key" 2>&1 | tee /tmp/g1.log
          ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/ci.key" 2>&1 | tee /tmp/g2.log
      - name: Dump build failure
        if: failure()
        run: |
          for f in /tmp/g1.log /tmp/g2.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            grep -nE "FAILURE|error:|Caused by|What went wrong|FAILED|Could not|Exception" "$f" | head -40
            echo "::endgroup::"
            tail -40 "$f"
          done
          df -h / || true
