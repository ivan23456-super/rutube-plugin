name: Build package

# Builds the .ppp with a throwaway key and commits the unsigned-content package
# to ci-artifacts/. The package contents (classes.dex + plugin.json) do not
# depend on the signing key, so the real key can re-sign it afterwards.
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'build.gradle', 'gradle.properties']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-36"
      - name: Build and index
        run: |
          ./gradlew :tools:genKey -PpluginSigningKey="$RUNNER_TEMP/ci.key"
          ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/ci.key"
      - name: Commit the package
        run: |
          mkdir -p ci-artifacts
          cp build/repo/*.ppp ci-artifacts/
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add ci-artifacts
          git commit -m "build: package $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
